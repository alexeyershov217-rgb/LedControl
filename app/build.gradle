plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.ledcontrol'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.ledcontrol"
        minSdk 21
        // targetSdk < 26 намеренно: так Android 9 учитывает свои цвет/режим
        // свечения из setLights(), а не заменяет их настройками канала.
        targetSdk 25
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
